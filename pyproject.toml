
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rompcm"
version = "0.1.0"
description = "Reduced order modelling for phase change materials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyfreefem"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rompcm = ["*.edp", "**/*.edp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long tests (excluded in CI)",
    "freefem: tests needing the FreeFEM executable",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]   # erreurs graves + pyflakes ; à élargir progressivement
